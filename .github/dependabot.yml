# Dependabot — the maintenance agent the specification promises (אפיון §4.11):
# it proposes dependency and security updates as pull requests; nothing
# lands without the owner's review (CODEOWNERS + branch protection), and
# every proposal is verified by the CI workflow before a human looks at it.
#
# Two npm roots: client/ and server/ — the workspace root holds scripts
# only and has no dependencies or lockfile, so it is deliberately absent.
# Minor + patch bumps are grouped into one PR per root per week so the
# queue stays readable; majors arrive on their own so a breaking bump is
# never buried in a group. Security advisories are not scheduled — GitHub
# raises those immediately regardless of this file. The actions the CI
# workflow pins are kept current the same way.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
